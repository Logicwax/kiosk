# Deterministic disk assembly for the kiosk live image — BOOT=grub (the default).
#
# This is the STOCK DEBIAN boot chain:
#
#   firmware ──db(Microsoft CA)──▶ BOOTX64.EFI  = Debian's MS-signed shim
#   shim     ──its embedded Debian cert──▶ grubx64.efi = Debian's SIGNED GRUB
#   GRUB     ──SHIM_LOCK protocol, back into shim──▶ vmlinuz = Debian's SIGNED kernel
#
# Every link is signed by a key the machine already trusts, so the image boots on a
# stock laptop with Secure Boot ENABLED and no MOK enrollment at all.
#
# The trade against BOOT=uki: GRUB verifies the *kernel* and nothing else. grub.cfg
# sits here in plain text on a FAT partition and initrd.img is likewise unverified,
# so anyone holding the USB can edit the cmdline or replace the initrd and it still
# boots cleanly under Secure Boot. BOOT=uki seals kernel + initrd + cmdline into one
# signed binary and closes that gap, at the cost of a one-time MokManager enrollment.
#
#   p1  ESP (FAT32)    -> shim + signed GRUB + grub.cfg + kernel + initrd
#   p2  squashfs root  -> raw mksquashfs image, no containing filesystem

image efi-part.vfat {
	vfat {
		# --invariant: no timestamps/volume-id entropy in the FAT metadata.
		# -i: a FIXED volume serial.  It matches the first field of the GPT UUIDs
		# below. Deterministic, so reproducibility holds.
		extraargs = "--invariant -i C105C0DE"

		file EFI/BOOT/BOOTX64.EFI {
			image = "shimx64.efi"
		}
		# shim's hardcoded second-stage name. Here it really is GRUB.
		file EFI/BOOT/grubx64.efi {
			image = "grubx64.efi"
		}
		# MokManager: nothing of ours needs enrolling in this mode, but shim launches
		# it on a verification failure, so shipping it keeps the recovery path intact.
		file EFI/BOOT/mmx64.efi {
			image = "mmx64.efi"
		}
		# Debian's signed GRUB has prefix=/EFI/debian baked into the binary, so this
		# path is not a preference — GRUB looks nowhere else for its config.
		file EFI/debian/grub.cfg {
			image = "grub.cfg"
		}
		# Loaded by grub.cfg from this same partition ($root).
		file vmlinuz {
			image = "vmlinuz"
		}
		file initrd.img {
			image = "initrd.img"
		}
	}
	size = 131072K
}

image kiosk.img {
	hdimage {
		disk-uuid = c105c0de-0000-4000-8000-000000000001
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = c105c0de-0000-4000-8000-000000000002
		offset = 32K
		bootable = true
	}

	# Referenced by the kernel cmdline as root=PARTUUID=<this>.
	partition root {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = c105c0de-0000-4000-8000-000000000003
		image = "rootfs.squashfs"
	}
}
