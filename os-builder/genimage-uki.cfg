# Deterministic disk assembly for the kiosk live image (UEFI-only).
#
# Every identifier that would otherwise be random is pinned, so the resulting
# .img is byte-reproducible.
#
#   p1  ESP (FAT32)      -> EFI/BOOT/BOOTX64.EFI = the UKI
#                           (kernel + initramfs + cmdline in one EFI-stub binary;
#                            no GRUB, no bootloader)
#   p2  squashfs root    -> raw mksquashfs image, no containing filesystem
#
# Writes go to a tmpfs overlay at runtime (dracut `rootovl`), so nothing on the
# USB is ever written and every boot starts clean.

image efi-part.vfat {
	vfat {
		# --invariant: no timestamps/volume-id entropy in the FAT metadata.
		# -i: a FIXED volume serial.  It matches the first field of the GPT
		# UUIDs below. Deterministic, so reproducibility holds.
		extraargs = "--invariant -i C105C0DE"

		# Boot chain:
		#   firmware -> BOOTX64.EFI (= Debian's MS-signed shim)
		#   shim     -> grubx64.efi (= OUR UKI; shim's hardcoded 2nd-stage name,
		#               despite containing no GRUB) — verified against a MOK
		#   on failure shim launches mmx64.efi (MokManager), where the user
		#   enrolls kiosk.der from this same ESP. With Secure Boot OFF shim just
		#   passes through, so this one layout works signed or unsigned.
		file EFI/BOOT/BOOTX64.EFI {
			image = "shimx64.efi"
		}
		file EFI/BOOT/grubx64.efi {
			image = "BOOTX64.EFI"
		}
		file EFI/BOOT/mmx64.efi {
			image = "mmx64.efi"
		}
		file EFI/kiosk.der {
			image = "kiosk.der"
		}
	}
	size = 131072K
}

image kiosk.img {
	hdimage {
		disk-uuid = c105c0de-0000-4000-8000-000000000001
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = c105c0de-0000-4000-8000-000000000002
		offset = 32K
		bootable = true
	}

	# Referenced by the kernel cmdline as root=PARTUUID=<this>.
	partition root {
		partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
		partition-uuid = c105c0de-0000-4000-8000-000000000003
		image = "rootfs.squashfs"
	}
}
