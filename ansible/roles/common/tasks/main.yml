---
- name: Ensure base APT tooling is present
  apt:
    name:
      - gnupg
      - ca-certificates
      - debian-archive-keyring
    state: present
    update_cache: yes

# Add official Debian repos (https, signed-by the Debian archive keyring)
- apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian trixie main contrib non-free non-free-firmware"
    state: present
    filename: debian-trixie

- apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian trixie-backports main contrib non-free non-free-firmware"
    state: present
    filename: debian-trixie-backports

- name: Install APT packages
  apt:
    update_cache: yes
    pkg:
    - autoconf
    - automake
    - build-essential
    - cmake
    - git
    - grub-efi-amd64
    - grub-efi-amd64-bin
    - grub-efi-ia32-bin
    - grub-pc
    - grub-pc-bin
    - grub2-common
    - libconfig-dev
    - parted
    - pkg-config
    - python3-setuptools
    - sudo

# Latest firmware blobs for modern hardware support / laptops
- name: Install backports APT packages
  apt:
    update_cache: yes
    pkg:
    - firmware-amd-graphics
    - firmware-linux
    - firmware-linux-nonfree
    - firmware-misc-nonfree
    - firmware-realtek
    - libxss1
    - xserver-xorg-video-all

- user:
    name: airgap
    shell: /bin/bash
    groups: sudo
    createhome: yes
    append: yes

- shell: passwd --delete airgap

- file:
    path: /home/airgap/.local/bin
    state: directory
    mode: "0755"

- lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: '^%sudo ALL\=\(ALL\) NOPASSWD: ALL'
    line: '%sudo ALL=(ALL) NOPASSWD: ALL'

- file:
    path: /home/airgap/.bash_profile
    state: touch
    mode: "0755"

- lineinfile:
    dest: /home/airgap/.bash_profile
    state: present
    regexp: '^clear$'
    line: 'clear'

- lineinfile:
    dest: /home/airgap/.bash_profile
    state: present
    regexp: '^export PATH=.*'
    line: 'export PATH="/usr/local/bin:/home/airgap/.local/bin:$PATH"'

- file:
    path: /home/airgap/.hushlogin
    state: touch
    mode: "0755"

- file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: "0755"

- template:
    src: autologin.conf
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    mode: "0755"

- systemd: name=getty@tty1 enabled=yes masked=no

- blockinfile:
    dest: /etc/default/grub
    state: present
    block: |
      GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX rootovl quiet splash loglevel=0 console=ttyS0,115200 earlyprintk=ttyS0,115200 nofb"
      GRUB_HIDDEN_TIMEOUT_QUIET=true
      GRUB_HIDDEN_TIMEOUT=0
      GRUB_TIMEOUT=0

- name: update-initramfs
  command: /usr/sbin/update-initramfs -u

- name: Install EFI GRUB
  block:
  - shell: |
      parted /dev/sda -- set 1 legacy_boot on
      grub-install --removable --no-floppy --no-nvram --uefi-secure-boot --target=i386-efi
      grub-install --removable --no-floppy --no-nvram --uefi-secure-boot --target=x86_64-efi
      grub-install --removable --no-floppy --no-nvram --uefi-secure-boot --target=i386-pc /dev/sda
      update-initramfs -ckall
      update-grub
  become: yes

# systemd isn't available in debian's initramfs-tools, so we use dracut
- name: Read-only overlay
  block:
  - lineinfile:
      dest: /etc/dracut.conf.d/overlay.conf
      create: yes
      insertafter: EOF
      line: 'filesystems+=" overlay "'
  - lineinfile:
      dest: /etc/dracut.conf.d/udev.conf
      create: yes
      insertafter: EOF
      line: 'filesystems+=" ext4 "'
  - apt:
      install_recommends: no
      pkg:
      - dracut
      - initramfs-tools-core
  - lineinfile:
      dest: /etc/dracut.conf.d/10-debian.conf
      create: yes
      regexp: "hostonly=yes"
      line: "hostonly=no"
  - shell: dracut --regenerate-all --force
  become: yes

# Disables CTRL-ALT-Fx for increased security
# Disable this section for easy debugging / CLI access
- name: Disable other TTY's
  block:
  - lineinfile:
      dest: /etc/systemd/logind.conf
      state: present
      regexp: '^#NAutoVTs=6'
      line: 'NAutoVTs=0'
  - lineinfile:
      dest: /etc/systemd/logind.conf
      state: present
      regexp: '^#ReserveVT=1'
      line: 'ReserveVT=1'
